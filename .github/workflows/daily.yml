name: Build feed

on:
  schedule:
    - cron: "0 13 * * *"   # 06:00 America/Los_Angeles (13:00 UTC). Adjust to taste.
  workflow_dispatch:        # lets you trigger a build by hand from the Actions tab
    inputs:
      reset_history:
        description: "Reset trend history — start the series fresh from this build (use after a taxonomy change)"
        type: boolean
        default: false
      selftest:
        description: "Validator self-test: inject a synthetic defect into validation ONLY (published feed untouched) to prove the alarm path"
        type: choice
        default: ""
        options:
          - ""
          - "E04_duplicate_url"
          - "E05_future_date"
          - "E06_bad_stage"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Golden regression tests
        # Freeze the deterministic engine: if a ranking weight, topic rule or taxonomy
        # label changed without a conscious re-freeze, this fails and the build is skipped,
        # so the previous validated site stays live rather than publishing drifted output.
        run: python tests/test_golden.py

      - name: Build the feed
        env:
          PRIVATE_DATA_TOKEN: ${{ secrets.COVERAGE_TOKEN }}   # existing secret → neutral env var
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          FAIL_ON_DEGRADE: "1"   # fail the run (skip publish) if >20% of steady feeds go silent
          # one-shot when the "reset_history" toggle is checked on a manual run; empty otherwise
          RESET_HISTORY: ${{ github.event.inputs.reset_history == 'true' && '1' || '' }}
          # opt-in validator self-test (blank on scheduled runs) — injects into validation only
          VALIDATE_SELFTEST: ${{ github.event.inputs.selftest }}
        run: python build.py

      - name: Commit the rebuilt page
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/index.html docs/feed.xml docs/feed.xsl docs/feed-*.xml docs/build.json docs/validation.json docs/data/
          if git diff --staged --quiet; then echo "no changes to publish"; exit 0; fi
          git commit -m "feed: $(date -u +'%Y-%m-%d')"
          # docs/* are fully regenerated every build, so on ANY conflict with an advanced main we keep
          # THIS build's output. `git rebase -X theirs` favours the commits being replayed (our fresh
          # build); the loop absorbs a race where main moves between fetch and push.
          published=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if git rebase -X theirs origin/main; then
              if git push origin HEAD:main; then published=1; break; fi
            else
              git rebase --abort || true
            fi
            sleep $((RANDOM % 6 + 2))
          done
          if [ "$published" != "1" ]; then echo "::error title=Publish failed::could not push after 5 attempts"; exit 1; fi

      # ---- post-publish DEPLOY freshness check (alert-only) ----------------------------------------
      # GitHub Pages deploys asynchronously and can lag or silently fail, leaving the PUBLIC site on an
      # older build than the one just committed. Poll the live build.json and confirm it reaches this
      # build; a persistent mismatch annotates a warning (the build is already published, so this never
      # unpublishes — it just surfaces a stale-deploy so it gets investigated).
      - name: Verify live deploy is fresh
        if: always()
        continue-on-error: true
        run: |
          python verify_deploy.py --local docs/build.json \
            --url https://asarmah123.github.io/ai-health-evidence-monitor/build.json \
            --retries 10 --wait 30

      # ---- post-publish validation (never blocks the publish above) --------------------------------
      # build.py has already written validation_status.json + validation_report.{md,html}. We read the
      # status and, only when the build flags issues, email a detailed summary so problems get caught
      # proactively. Publication has already happened by this point — validation is alert-only.
      - name: Read validation status
        id: val
        if: always()
        run: |
          if [ -f validation_status.json ]; then
            nerr=$(jq -r '.n_errors' validation_status.json)
            nwarn=$(jq -r '.n_warnings' validation_status.json)
            ok=$(jq -r '.ok' validation_status.json)
            st=$(jq -r '.selftest // false' validation_status.json)
            if [ "$ok" = "true" ]; then tag="✅ PASS"; else tag="⚠️ ${nerr} error(s), ${nwarn} warning(s)"; fi
            if [ "$st" = "true" ]; then tag="🧪 SELF-TEST · ${tag}"; fi
            echo "have=true"                       >> "$GITHUB_OUTPUT"
            echo "tag=$tag"                        >> "$GITHUB_OUTPUT"
            echo "date=$(date -u +'%Y-%m-%d %H:%M') UTC" >> "$GITHUB_OUTPUT"
          else
            echo "have=false"       >> "$GITHUB_OUTPUT"
            echo "tag=❓ no report"  >> "$GITHUB_OUTPUT"
          fi

      # Email the validation summary on EVERY build (pass or fail), so there is a positive daily record
      # that the build was checked — silence is never assumed to mean 'clean'.
      - name: Email validation report
        if: always() && steps.val.outputs.have == 'true'
        continue-on-error: true   # a mail hiccup must not mark a successfully-published build as failed
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: AI-HEOR Monitor <${{ secrets.SMTP_USERNAME }}>
          to: tercera.research@gmail.com
          subject: "AI-HEOR build validation — ${{ steps.val.outputs.tag }} — ${{ steps.val.outputs.date }}"
          html_body: file://validation_report.html
          convert_markdown: false
