name: Build feed

on:
  schedule:
    - cron: "0 13 * * *"   # 06:00 America/Los_Angeles (13:00 UTC). Adjust to taste.
  workflow_dispatch:        # lets you trigger a build by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build the feed
        env:
          COVERAGE_TOKEN: ${{ secrets.COVERAGE_TOKEN }}
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          FAIL_ON_DEGRADE: "1"   # fail the run (skip publish) if >20% of steady feeds go silent
        run: python build.py

      - name: Commit the rebuilt page
        run: |
          git config user.name  "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs/index.html docs/feed.xml docs/feed.xsl docs/feed-*.xml
          git diff --staged --quiet || git commit -m "feed: $(date -u +'%Y-%m-%d')"
          git push
